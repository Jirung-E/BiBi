name: Verify BiBi
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.57.0'
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config patchelf
      - name: Install development dependencies
        run: just install
      - name: Linux browser test libraries
        if: runner.os == 'Linux'
        run: npm --prefix gui/frontend run install:ui-deps
      - name: Verify UI, tests, debug/release builds, and package
        run: just test
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        run: just test-install
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UI-failure-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            gui/frontend/playwright-report/
            gui/frontend/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: BiBi-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bibi
            target/release/bibi.exe
            target/release/bibi-desktop
            target/release/bibi-desktop.exe
            target/release/bundle/*.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*-setup.exe
