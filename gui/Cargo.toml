[package]
name = "bibi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bibi-core = { path = "../core" }
bibi-server = { path = "../server" }
tauri = { version = "2", features = [] }
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-dialog = "2.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
axum.workspace = true
